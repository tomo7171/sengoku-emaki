name: Publish game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p site
          cp index.html preview.png .nojekyll site/
          cp tenka-portraits.js tenka-castles.js tenka-systems.js tenka-dynasty.js tenka-tactics.js tenka-ui.js tenka-ui.css site/
          if [ -f battle.png ]; then cp battle.png site/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
